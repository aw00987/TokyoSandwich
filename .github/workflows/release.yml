name: Release

# Push a tag like v0.1.0 to build a signed APK and publish it as a GitHub Release.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches versionName
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version in app/build.gradle.kts"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore the signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Secret SIGNING_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test and build the signed release APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="TokyoSandwich-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --title "$GITHUB_REF_NAME" --generate-notes

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
